# #############################################################
# Pinyin-Doc-Converter 配置文件
# 用于控制带有拼音标注的Word文档的简繁转换功能
# #############################################################

# 输入文件路径：需要转换的Word文档路径
# 支持格式：.docx文件
input_file: '/path/to/your/input.docx'

# 输出文件路径：转换后的文档保存路径
# 留空则默认保存到与输入文件相同路径，文件名添加相应后缀
# 例如：input.docx → input-HK.docx（中国香港繁体）或 input-TW.docx（中国台湾繁体）
output_file: ''

# 转换类型：指定文档的转换方向
# 可选值：
#   1: 简体中文 → 繁体中文
#   2: 繁体中文 → 简体中文
conversion_type: 1

# 智能模式开关：控制转换的精度和方式
# 可选值：
#   true: 启用智能模式（推荐）
#   false: 禁用智能模式
# 智能模式特性：
# 1. 使用词语级转换提高准确率（如"计算机"→"計算機"）
# 2. 保持拼音文本不变，避免转换后拼音与文字错位
# 3. 使用术语映射表确保转换后字数一致
# 禁用时仅使用字符级转换，可能导致特定术语转换不准确
smart_mode: true

# 地区差异转换选项：仅在转换类型为1（简转繁）时生效
# 用于选择繁体中文的地区标准
# 可选值：
#   hk: 中国香港繁体（默认）
#   tw: 中国台湾繁体
# 地区差异说明：
# - 中国香港繁体：使用中国香港地区通用的术语和字形（如"軟件"、"服務器"、"數據庫"）
# - 中国台湾繁体：使用中国台湾地区通用的术语和字形（如"軟體"、"伺服器"、"資料庫"）
region: hk
